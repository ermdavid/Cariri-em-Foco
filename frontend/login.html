<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portal de notícias da região do Cariri">

    <title>Cariri em Foco | Portal de Notícias</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/variaveis.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">


    <script src="assets/js/config.js"></script>
    <script src="assets/js/global.js"></script>
</head>
<body>

    <!-- Link para retornar ao portal principal -->
    <a href="../index.html" class="btn-voltar">
        ← Voltar ao portal
    </a>

    <!-- Container do Login -->
    <div class="login-card">
        
        <div class="login-header">
            <h1>CARIRI <span>EM FOCO</span></h1>
            <p>Acesso Restrito à Redação</p>
        </div>

        <form class="login-body" id="formLogin">
            
            <!-- Mensagem de erro dinâmica -->
            <div id="mensagemErro" class="mensagem-erro"></div>

            <div class="grupo-campo">
                <label for="email">E-mail do Redator</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="redacao@caririemfoco.com.br" 
                    required
                    autocomplete="email"
                >
            </div>

            <div class="grupo-campo">
                <label for="senha">Senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    name="senha" 
                    placeholder="••••••••" 
                    required
                >
            </div>

            <button type="submit" class="btn-submit">Entrar no Painel</button>
        </form>

        <div class="login-footer">
            SISTEMA INTERNO • USO EXCLUSIVO DA REDAÇÃO
        </div>
    </div>

    <script src="assets/js/paginas/login.js"></script>

</body>
</html>
