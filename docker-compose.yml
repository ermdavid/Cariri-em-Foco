services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_DB: cariri_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpostgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  postgres_data: